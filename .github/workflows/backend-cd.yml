name: Backend CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cd.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Grant execute permission
        working-directory: backend
        run: chmod +x gradlew

      - name: Build backend jar
        working-directory: backend
        run: ./gradlew clean bootJar

      - name: Make deployment package
        run: |
          mkdir deploy
          cp backend/build/libs/*.jar deploy/application.jar
          echo "web: java -jar application.jar" > deploy/Procfile
          cd deploy
          zip -r deploy.zip .

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: hyfive-backend
          environment_name: hyfive-backend-env
          region: ${{ secrets.AWS_REGION }}
          version_label: backend-${{ github.sha }}
          deployment_package: deploy/deploy.zip