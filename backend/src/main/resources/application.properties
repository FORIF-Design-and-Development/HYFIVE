spring.application.name=backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hyfive}
spring.datasource.username=${DB_USERNAME:hyfive}
spring.datasource.password=${DB_PASSWORD:hyfive-local-password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

google.client-id=${GOOGLE_CLIENT_ID:715241606209-h3rri9o582bk5899895lcggomq406nos.apps.googleusercontent.com}

jwt.secret=${JWT_SECRET:local-dev-secret-must-be-long-enough-change-later}
jwt.access-token-expiration-minutes=30
jwt.refresh-token-expiration-days=14
