<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HYFIVE 이메일 인증</title>
</head>
<!--
  HYFIVE 회원가입 이메일 인증 본문.
  백엔드에서 Thymeleaf context.setVariable("code", ...) 로 ${code} 주입.
  이메일 클라이언트(Gmail/네이버 등)는 외부 CSS·클래스를 무시하므로 table 레이아웃 + inline style 필수.
  색상은 DESIGN.md 토큰 값(브랜드 컬러)을 그대로 인라인으로 사용.
-->
<body style="margin:0; padding:0; background-color:#EEF2F8;">
  <!-- 미리보기(프리헤더) 텍스트 — 받은편지함 목록에서 제목 옆에 노출 -->
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:#EEF2F8; font-size:1px; line-height:1px;">
    HYFIVE 이메일 인증번호를 확인하세요. 3분 안에 입력해 주세요.
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background-color:#EEF2F8; padding:24px 0;">
    <tr>
      <td align="center">

        <!-- 카드 컨테이너 (너비 고정) -->
        <table role="presentation" width="440" cellpadding="0" cellspacing="0" border="0"
               style="width:440px; max-width:440px; background-color:#FFFFFF; border-radius:16px; overflow:hidden; border:1px solid #EBEBEB;">

          <!-- 헤더 (브랜드 그라데이션, 미지원 클라이언트는 solid #1B4B8C로 폴백) -->
          <tr>
            <td align="center"
                style="background-color:#1B4B8C; background-image:linear-gradient(135deg, #0D2B5E 0%, #2E6DB4 100%); padding:32px 24px;">
              <span style="font-family:'Nunito','Noto Sans KR',Arial,sans-serif; font-size:28px; font-weight:800; letter-spacing:1px; color:#FFFFFF;">HYFIVE</span>
              <p style="margin:6px 0 0; font-family:'Noto Sans KR',Arial,sans-serif; font-size:13px; color:#E8F0FA;">반려동물 건강 관리</p>
            </td>
          </tr>

          <!-- 본문 -->
          <tr>
            <td style="padding:32px 32px 24px;">
              <p style="margin:0 0 8px; font-family:'Noto Sans KR',Arial,sans-serif; font-size:18px; font-weight:700; color:#0D2B5E;">
                이메일 인증번호
              </p>
              <p style="margin:0 0 24px; font-family:'Noto Sans KR',Arial,sans-serif; font-size:14px; line-height:1.6; color:#1C1C1C;">
                아래 인증번호를 회원가입 화면에 입력해 주세요.<br />
                인증번호는 <strong style="color:#1B4B8C;">3분간</strong> 유효합니다.
              </p>

              <!-- 인증코드 박스 -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center"
                      style="background-color:#E8F0FA; border:1px solid #C5D8EE; border-radius:12px; padding:20px 0;">
                    <span th:text="${code}"
                          style="font-family:'Courier New',monospace; font-size:34px; font-weight:800; letter-spacing:10px; color:#1B4B8C;">123456</span>
                  </td>
                </tr>
              </table>

              <p style="margin:24px 0 0; font-family:'Noto Sans KR',Arial,sans-serif; font-size:12px; line-height:1.6; color:#BDBDBD;">
                본인이 요청하지 않았다면 이 메일을 무시하셔도 됩니다.<br />
                인증번호를 타인에게 공유하지 마세요.
              </p>
            </td>
          </tr>

          <!-- 푸터 -->
          <tr>
            <td style="border-top:1px solid #EBEBEB; padding:16px 32px;">
              <p style="margin:0; font-family:'Noto Sans KR',Arial,sans-serif; font-size:11px; color:#BDBDBD;">
                © 2026 HYFIVE. 본 메일은 발신 전용입니다.
              </p>
            </td>
          </tr>

        </table>
        <!-- /카드 -->

      </td>
    </tr>
  </table>
</body>
</html>
